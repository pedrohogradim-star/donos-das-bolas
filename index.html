function renderPList(){
  const scores=computeScores();
  const c=document.getElementById('plist-items');
  c.innerHTML=PARTICIPANTS.map(p=>{
    const totalOpen=ROUNDS.filter(r=>state.unlocked[r.id]).reduce((s,r)=>s+r.games.length,0);

    },0);

// ---- TABS ----
function showTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['palpites','especiais','resultados','rank'][i]===t));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='palpites')renderPalpites();
  if(t==='especiais')renderEspeciais();
  if(t==='resultados')renderResultados();
  if(t==='rank')renderRank();
}

// ---- PALPITES ----
function isGameOpen(rid,gid){
  // If round not closed at all, game is open
  if(!state.closed[rid])return true;
  // Round closed: only open if Pedro manually reopened AND game hasn't started
  if(state.gameReopened[rid]&&state.gameReopened[rid][gid]&&!gameStarted(gid))return true;
  return false;
}

function renderPalpites(){
  const c=document.getElementById('tab-palpites');
  const r=ROUNDS.find(x=>x.id===activePTab)||ROUNDS[0];
  if(!state.votes[r.id])state.votes[r.id]={};
  if(!state.votes[r.id][activeP])state.votes[r.id][activeP]={};
  const pv=state.votes[r.id][activeP];
  const done=r.games.filter(g=>pv[g.id]).length;

  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <button class="back-btn" onclick="goBackToList()">← ${activeP}</button>
    <span class="pill ${done===r.games.length?'pill-ok':'pill-no'}">${done}/${r.games.length}</span>
  </div>`;

  const roundBtns=ROUNDS.map(r2=>{
    const ul=state.unlocked[r2.id];
    const cl=state.closed[r2.id];
    return `<button class="rtab${activePTab===r2.id?' active':''}" onclick="selPTab('${r2.id}')" ${!ul?'disabled':''}>${r2.name}${cl?' 🔒':''}</button>`;
  }).join('');
  html+=`<div class="round-tab-row">${roundBtns}</div>`;

  // Pedro admin bar for reopening
  if(IS_PEDRO(activeP)&&state.closed[r.id]){
    const canReopen=r.games.some(g=>!gameStarted(g.id));
    html+=`<div class="admin-bar">
      <span class="admin-label">★ Admin — Reabrir palpites</span>
      <span class="reopen-badge">Apenas jogos não iniciados</span>
    </div>`;
  }

  r.games.forEach(g=>{
    const sel=pv[g.id]||'';
    const res=state.results[r.id]&&state.results[r.id][g.id];
    const open=isGameOpen(r.id,g.id);
    const started=gameStarted(g.id);
    const roundClosed=state.closed[r.id];
    const reopened=state.gameReopened[r.id]&&state.gameReopened[r.id][g.id];

    const bc=(v,base)=>{
      let cls=base||'vote-btn';
      if(roundClosed&&res){
        if(sel===v&&v===res)return cls+' correct';
        if(sel===v&&v!==res)return cls+' wrong';
        if(v===res)return cls+' sel';
        return cls;
      }
      return cls+(sel===v?' sel':'');
    };

    // parcial: who voted what
    const allVotes=PARTICIPANTS.map(pp=>{
      const ppv=(state.votes[r.id]&&state.votes[r.id][pp])||{};
      return{name:pp,vote:ppv[g.id]||''};
    });
    const homeVoters=allVotes.filter(x=>x.vote==='home').map(x=>x.name.split(' ')[0]);
    const drawVoters=allVotes.filter(x=>x.vote==='draw').map(x=>x.name.split(' ')[0]);
    const awayVoters=allVotes.filter(x=>x.vote==='away').map(x=>x.name.split(' ')[0]);

    const metaRight=IS_PEDRO(activeP)&&roundClosed
      ?`<button class="game-lock-toggle${reopened&&!started?' open':''}" onclick="toggleReopen('${r.id}','${g.id}')">${reopened&&!started?'🔓 ABERTO':'🔒 REABRIR'}</button>`
      :(started&&roundClosed?'<span style="font-size:9px;color:#555">em andamento</span>':'');

    html+=`<div class="game-block">
      <div class="game-meta"><span>${g.time} · Grupo ${g.group}</span>${metaRight}</div>
      <div class="vote-row">
        <button class="${bc('home','vote-btn')}" onclick="${open?`setVote('${r.id}','${g.id}','home')`:''}">
          <span style="font-size:16px">${F(g.home)}</span>
          <span style="font-size:9px;letter-spacing:.3px">${g.home}</span>
        </button>
        <button class="${bc('draw','vote-draw')}" onclick="${open?`setVote('${r.id}','${g.id}','draw')`:''}" style="font-size:8px;padding:6px 4px">EMPATE</button>
        <button class="${bc('away','vote-btn')}" onclick="${open?`setVote('${r.id}','${g.id}','away')`:''}" style="flex-direction:row-reverse">
          <span style="font-size:16px">${F(g.away)}</span>
          <span style="font-size:9px;letter-spacing:.3px">${g.away}</span>
        </button>
      </div>
      <div class="parcial-row">
        <div class="parcial-cell">${homeVoters.length?`<span style="color:#8B6914;font-size:8px">${homeVoters.join(', ')}</span>`:''}</div>
        <div class="parcial-cell center-cell">${drawVoters.length?`<span style="color:#8B6914;font-size:8px">${drawVoters.join(', ')}</span>`:''}</div>
        <div class="parcial-cell right-cell">${awayVoters.length?`<span style="color:#8B6914;font-size:8px">${awayVoters.join(', ')}</span>`:''}</div>
      </div>
    </div>`;
  });
  c.innerHTML=html;
}
function goBackToList(){
  document.getElementById('screen-main').style.display='none';
  document.getElementById('screen-plist').style.display='';
  renderPList();
}
function selPTab(rid){activePTab=rid;renderPalpites();}
function setVote(rid,gid,val){
  if(!isGameOpen(rid,gid))return;
  if(!state.votes[rid])state.votes[rid]={};
  if(!state.votes[rid][activeP])state.votes[rid][activeP]={};
  state.votes[rid][activeP][gid]=val;
  save();renderPalpites();
}
function toggleReopen(rid,gid){
  if(!IS_PEDRO(activeP))return;
  if(gameStarted(gid)){alert('Este jogo já começou — não é possível reabrir.');return;}
  if(!state.gameReopened[rid])state.gameReopened[rid]={};
  state.gameReopened[rid][gid]=!state.gameReopened[rid][gid];
  save();renderPalpites();
}

    const arr=Array.isArray(spData)?spData:[spData].filter(Boolean);

      <div class="special-icon">${sp.icon}</div>

    </div>`;
  });
  html+=`</div>`;

  // Pedro admin: manage others' specials
  if(IS_PEDRO(activeP)){
    html+=`<div style="margin-top:1rem"><p class="admin-label" style="font-size:10px;color:#8B6914;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">★ Admin — Gerenciar palpites especiais de outros</p>`;
    PARTICIPANTS.filter(p=>p!=='Pedro').forEach(p=>{
      html+=`<div class="card" style="padding:.75rem 1rem;margin-bottom:.5rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:13px;font-weight:600;color:#ccc">${p}</span>
          <button class="btn" style="font-size:9px;padding:3px 8px" onclick="resetAllSpecials('${p}')">Resetar todos</button>
        </div>
        <div class="special-admin-list">
          ${SPECIALS.map(sp=>{
            const locked=state.specialLocked[p]&&state.specialLocked[p][sp.id];
            const spData=(state.specials[p]&&state.specials[p][sp.id])||[];
            const arr=Array.isArray(spData)?spData:[spData].filter(Boolean);
            return `<div class="special-admin-item">
              <span class="special-admin-name">${sp.icon} ${sp.label}</span>
              <span class="special-admin-val">${arr.length?arr.map(t=>`${F(t)} ${t}`).join(', '):'-'}</span>
              ${locked?`<button class="btn btn-warn" style="font-size:9px;padding:2px 8px" onclick="unlockSpecial('${p}','${sp.id}')">🔓 Reabrir</button>`:`<span style="font-size:9px;color:#444">aberto</span>`}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  c.innerHTML=html;
}

function openSpecial(spId){
  const sp=SPECIALS.find(s=>s.id===spId);
  if(!sp)return;
  const locked=state.specialLocked[activeP]&&state.specialLocked[activeP][spId];
  if(locked&&!IS_PEDRO(activeP)){alert('Você já enviou este palpite. Apenas o Pedro pode reabrir.');return;}
  modalSpecial=spId;
  const cur=(state.specials[activeP]&&state.specials[activeP][spId])||[];
  modalTempSel=Array.isArray(cur)?[...cur]:(cur?[cur]:[]);
  document.getElementById('modal-title').textContent=`${sp.icon} ${sp.label}`;
  document.getElementById('modal-sub').textContent=sp.desc+(sp.max>1?` (máx ${sp.max})`:'');
  const grid=document.getElementById('modal-team-grid');
  grid.innerHTML=ALL_TEAMS.map(t=>`
    <div class="team-item${modalTempSel.includes(t)?' sel':''}" onclick="toggleTeamModal('${t}')">
      <span class="team-flag">${F(t)}</span>
      <span class="team-name">${t}</span>
    </div>`).join('');
  document.getElementById('modal-overlay').style.display='flex';
}
function toggleTeamModal(t){
  const sp=SPECIALS.find(s=>s.id===modalSpecial);
  if(modalTempSel.includes(t)){
    modalTempSel=modalTempSel.filter(x=>x!==t);
  } else {
    if(modalTempSel.length>=sp.max){modalTempSel.shift();}
    modalTempSel.push(t);
  }
  const items=document.querySelectorAll('.team-item');
  items.forEach(el=>{
    const name=el.querySelector('.team-name').textContent;
    el.classList.toggle('sel',modalTempSel.includes(name));
  });
}
function confirmSpecial(){
  if(!modalTempSel.length){alert('Selecione pelo menos uma seleção.');return;}
  const sp=SPECIALS.find(s=>s.id===modalSpecial);
  if(!state.specials[activeP])state.specials[activeP]={};
  state.specials[activeP][modalSpecial]=sp.max===1?modalTempSel[0]:[...modalTempSel];
  if(!state.specialLocked[activeP])state.specialLocked[activeP]={};
  state.specialLocked[activeP][modalSpecial]=true;
  save();closeModalDirect();renderEspeciais();
}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modal-overlay').style.display='none';modalSpecial=null;modalTempSel=[];}
function unlockSpecial(p,spId){
  if(!state.specialLocked[p])return;
  state.specialLocked[p][spId]=false;
  save();renderEspeciais();
}
function resetAllSpecials(p){
  if(!confirm(`Resetar todos os palpites especiais de ${p}?`))return;
  state.specialLocked[p]={};
  state.specials[p]={};
  save();renderEspeciais();
}

      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="result-btn${sel==='home'?' sel':''}" onclick="${locked?'':'setResult(\''+r.id+'\',\''+g.id+'\',\'home\')'}">${F(g.home)} ${g.home}</button>
        <button class="result-btn${sel==='draw'?' sel':''}" onclick="${locked?'':'setResult(\''+r.id+'\',\''+g.id+'\',\'draw\')'}">Empate</button>
        <button class="result-btn${sel==='away'?' sel':''}" onclick="${locked?'':'setResult(\''+r.id+'\',\''+g.id+'\',\'away\')'}">${F(g.away)} ${g.away}</button>
      </div>
    </div>`;
  });
  const allFilled=r.games.every(g=>rr[g.id]);
  if(!locked){
    html+=`<button class="btn btn-green" style="width:100%;margin-top:8px;padding:11px" ${!allFilled?'disabled':''} onclick="closeRound('${r.id}')">▶ Gerar Resultado — ${r.name}</button>`;
    if(!allFilled)html+=`<p style="font-size:10px;color:#444;text-align:center;margin-top:5px;letter-spacing:.5px">Preencha todos os resultados para gerar.</p>`;
  }
  c.innerHTML=html;
}
function setResult(rid,gid,val){
  if(state.closed[rid])return;
  if(!state.results[rid])state.results[rid]={};
  state.results[rid][gid]=val;
  save();renderResBody();
}
function closeRound(rid){
  state.closed[rid]=true;
  const idx=ROUNDS.findIndex(r=>r.id===rid);
  if(idx+1<ROUNDS.length)state.unlocked[ROUNDS[idx+1].id]=true;
  save();renderResultados();showTab('rank');
}

// ---- RANK ----
function computeScores(){
  const sc={};
  PARTICIPANTS.forEach(p=>sc[p]={total:0,byRound:{}});
  ROUNDS.forEach(r=>{
    const res=state.results[r.id]||{};
    const votes=state.votes[r.id]||{};
    PARTICIPANTS.forEach(p=>{
      const pv=votes[p]||{};
      let pts=0;
      r.games.forEach(g=>{if(res[g.id]&&pv[g.id]===res[g.id])pts++;});
      sc[p].byRound[r.id]=pts;
      sc[p].total+=pts;
    });
  });
  return sc;
}
function renderRank(){
  const c=document.getElementById('tab-rank');
  const scores=computeScores();
  const closedRounds=ROUNDS.filter(r=>state.closed[r.id]);
  const tabBtns=[`<button class="rtab${activeRankTab==='all'?' active':''}" onclick="selRankTab('all')">Geral</button>`]
    .concat(closedRounds.map(r=>`<button class="rtab${activeRankTab===r.id?' active':''}" onclick="selRankTab('${r.id}')">${r.name}</button>`))
    .join('');
  let sorted=PARTICIPANTS.map(p=>({name:p,pts:activeRankTab==='all'?scores[p].total:(scores[p].byRound[activeRankTab]||0)}))
    .sort((a,b)=>b.pts-a.pts);
  const totalGames=activeRankTab==='all'
    ?closedRounds.reduce((s,r)=>s+r.games.length,0)
    :(ROUNDS.find(r=>r.id===activeRankTab)||{games:[]}).games.length;
  const topPts=sorted[0]?sorted[0].pts:0;
  const avg=sorted.length?Math.round(sorted.reduce((s,p)=>s+p.pts,0)/sorted.length):0;
  let html=`<div class="round-tab-row">${tabBtns}</div>`;
  if(!closedRounds.length){html+=`<div class="empty">🏆<br><br>Nenhuma rodada encerrada ainda.</div>`;c.innerHTML=html;return;}
  html+=`<div class="summary-bar">
    <div class="smet"><div class="smet-val">${sorted.length}</div><div class="smet-lbl">participantes</div></div>
    <div class="smet"><div class="smet-val">${totalGames}</div><div class="smet-lbl">jogos</div></div>
    <div class="smet"><div class="smet-val">${topPts}</div><div class="smet-lbl">líder</div></div>
    <div class="smet"><div class="smet-val">${avg}</div><div class="smet-lbl">média</div></div>
  </div>`;
  const medals=['m1','m2','m3'];
  html+=`<div class="card" style="padding:.6rem;overflow-x:auto"><table class="rank-table"><thead><tr>
    <th style="width:32px">#</th><th>Nome</th>`;
  if(activeRankTab==='all')closedRounds.forEach(r=>{html+=`<th style="width:72px;text-align:right">${r.name}</th>`;});
  html+=`<th style="width:55px;text-align:right">Pts</th></tr></thead><tbody>`;
  sorted.forEach((s,i)=>{
    const pos=i<3?`<span class="medal ${medals[i]}">${i+1}</span>`:`<span style="color:#444;font-weight:600">${i+1}</span>`;
    const nameColor=i===0?'#FFD700':i===1?'#aaa':i===2?'#cd7f32':'#bbb';
    html+=`<tr><td>${pos}</td><td style="font-weight:${i<3?700:500};color:${nameColor}">${s.name}</td>`;
    if(activeRankTab==='all')closedRounds.forEach(r=>{html+=`<td style="text-align:right;color:#555">${scores[s.name].byRound[r.id]||0}</td>`;});
    html+=`<td style="text-align:right"><span class="pts">${s.pts}</span></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  c.innerHTML=html;
}
function selRankTab(rid){activeRankTab=rid;renderRank();}
</script>
