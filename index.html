<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Os Donos das Bolas — Bolão Copa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;min-height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Oswald',sans-serif;color:#ccc}
.app{background:#0a0a0a;min-height:100vh;padding-bottom:2rem;position:relative;overflow-x:hidden}
.wm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:min(260px,50vw);opacity:.04;pointer-events:none;z-index:0;user-select:none;line-height:1}
.inner{position:relative;z-index:1;max-width:680px;margin:0 auto}
.header{text-align:center;padding:1.4rem 1rem .9rem;border-bottom:1px solid #8B6914}
.header h1{font-size:clamp(20px,5vw,28px);font-weight:700;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(135deg,#FFD700,#FFA500,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{font-size:10px;letter-spacing:2px;color:#8B6914;margin-top:4px;text-transform:uppercase}
.header-admin{font-size:11px;color:#4caf50;letter-spacing:1px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.tabs{display:flex;border-bottom:1px solid #8B6914;position:sticky;top:0;z-index:100;background:#0a0a0a}
.tab{flex:1;padding:11px 2px;font-size:10px;font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.5px;text-transform:uppercase;background:transparent;border:none;cursor:pointer;color:#666;transition:all .2s;white-space:nowrap}
.tab.active{color:#FFD700;border-bottom:2px solid #FFD700}
.section{display:none;padding:.9rem}.section.active{display:block}
.btn-gold{width:100%;padding:14px;background:linear-gradient(135deg,#8B6914,#FFD700);color:#000;font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:6px;cursor:pointer;margin-top:10px;transition:all .2s}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-outline{width:100%;padding:12px;background:transparent;color:#8B6914;font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:1px solid #8B6914;border-radius:6px;cursor:pointer;margin-top:8px;transition:all .2s}
.btn-outline:hover{border-color:#FFD700;color:#FFD700}
.btn-green{background:#0d3b1a;color:#4caf50;border:1px solid #4caf50;font-weight:600;width:100%;padding:13px;margin-top:8px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;border-radius:4px;cursor:pointer;transition:all .2s}
.btn-green:hover:not(:disabled){background:#4caf50;color:#000}
.btn-green:disabled{opacity:.4;cursor:not-allowed}
.btn-reopen{background:#0a1a2a;color:#64b5f6;border:1px solid #1565c0;font-weight:600;width:100%;padding:10px;margin-top:6px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;border-radius:4px;cursor:pointer;transition:all .2s}
.btn-reopen:hover{background:#1565c0;color:#fff}
.rtab{padding:7px 12px;font-size:11px;font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:1px;text-transform:uppercase;border:1px solid #444;border-radius:4px;background:transparent;cursor:pointer;color:#666;transition:all .2s}
.rtab.active{border-color:#FFD700;color:#FFD700;background:#1a1500}
.rtab:disabled{opacity:.3;cursor:not-allowed}
.round-tab-row{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.game-block{border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;margin-bottom:6px;background:#0d0d0d}
.game-meta{font-size:10px;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.vote-row{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center}
.vote-btn{padding:8px 4px;font-size:11px;font-family:'Oswald',sans-serif;font-weight:500;border:1px solid #333;border-radius:4px;background:#0a0a0a;cursor:pointer;color:#666;text-align:center;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;line-height:1.2}
.vote-btn .fl{font-size:22px;line-height:1}
.vote-btn .tn{font-size:10px;letter-spacing:.3px}
.vote-btn:active:not(:disabled){opacity:.7}
.vote-btn.sel{background:#1a1500;border-color:#FFD700;color:#FFD700;font-weight:600}
.vote-btn.correct{background:#0d3b1a;border-color:#4caf50;color:#4caf50;font-weight:600}
.vote-btn.wrong{background:#3b0d0d;border-color:#f44336;color:#f44336;opacity:.6;text-decoration:line-through}
.vote-btn:disabled{cursor:not-allowed;opacity:.5}
.vote-draw{font-size:10px;padding:8px 5px;border:1px solid #333;border-radius:4px;background:#0a0a0a;cursor:pointer;color:#666;text-align:center;font-family:'Oswald',sans-serif;font-weight:500;transition:all .15s;min-height:54px;display:flex;align-items:center;justify-content:center}
.vote-draw.sel{background:#1a1500;border-color:#FFD700;color:#FFD700;font-weight:600}
.vote-draw.correct{background:#0d3b1a;border-color:#4caf50;color:#4caf50}
.vote-draw.wrong{background:#3b0d0d;border-color:#f44336;color:#f44336;opacity:.6;text-decoration:line-through}
.vote-draw:disabled{cursor:not-allowed;opacity:.5}
.result-btn{padding:7px 10px;font-size:11px;font-family:'Oswald',sans-serif;font-weight:500;border:1px solid #333;border-radius:4px;background:transparent;cursor:pointer;color:#666;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.result-btn:hover{border-color:#8B6914;color:#ccc}
.result-btn.sel{background:#0d3b1a;border-color:#4caf50;color:#4caf50;font-weight:600}
.rank-table{width:100%;border-collapse:collapse}
.rank-table th{text-align:left;padding:8px 8px;font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8B6914;border-bottom:1px solid #2a2a2a}
.rank-table td{padding:8px 8px;border-bottom:1px solid #1a1a1a;color:#ccc;font-size:13px}
.rank-table tr:last-child td{border-bottom:none}
.medal{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.m1{background:#FFD700;color:#000}.m2{background:#aaa;color:#000}.m3{background:#cd7f32;color:#fff}
.pts{display:inline-block;min-width:28px;text-align:center;padding:2px 7px;border-radius:3px;background:#1a1500;border:1px solid #8B6914;font-size:13px;font-weight:600;color:#FFD700}
.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.pill-ok{background:#0d3b1a;color:#4caf50;border:1px solid #4caf50}
.pill-no{background:#1a1a1a;color:#555;border:1px solid #333}
.notice{border-radius:6px;padding:10px 14px;font-size:12px;margin-bottom:10px;letter-spacing:.5px;line-height:1.5}
.notice-warn{background:#1a1000;border:1px solid #8B6914;color:#8B6914}
.notice-info{background:#0a1a2a;border:1px solid #1565c0;color:#64b5f6}
.notice-ok{background:#0d3b1a;border:1px solid #4caf50;color:#4caf50}
.notice-err{background:#3b0d0d;border:1px solid #f44336;color:#f44336}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1rem}
.smet{background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:10px 6px;text-align:center}
.smet-val{font-size:20px;font-weight:700;color:#FFD700}
.smet-lbl{font-size:9px;color:#666;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.empty{text-align:center;padding:2.5rem;color:#444;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.participant-modal{background:#0d0d0d;border:1px solid #8B6914;border-radius:8px;overflow:hidden}
.plist-header{padding:12px 16px;border-bottom:1px solid #2a2a2a;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#8B6914}
.pitem{padding:13px 16px;cursor:pointer;color:#aaa;font-size:15px;font-weight:500;letter-spacing:.5px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between;transition:background .15s;-webkit-tap-highlight-color:transparent}
.pitem:last-child{border-bottom:none}
.pitem:active{background:#1a1a1a}
.pitem.active-p{background:#1a1500;color:#FFD700;border-left:3px solid #FFD700}
.back-btn{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#8B6914;cursor:pointer;margin-bottom:12px;background:none;border:none;font-family:'Oswald',sans-serif;padding:0}
.pname-display{font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#FFD700;margin-bottom:4px}
.card-wrap{background:#111;border:1px solid #8B6914;border-radius:6px;padding:.75rem;overflow-x:auto;margin-bottom:.75rem}
.saving{position:fixed;bottom:20px;right:16px;background:#1a1500;border:1px solid #8B6914;color:#FFD700;padding:7px 14px;border-radius:4px;font-size:11px;font-family:'Oswald',sans-serif;letter-spacing:1px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
.saving.show{opacity:1}
.loading-screen{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:12px}
.loading-screen p{color:#8B6914;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.spinner{width:36px;height:36px;border:2px solid #2a2a2a;border-top-color:#FFD700;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* countdown */
.countdown-box{background:#0a0a1a;border:1px solid #1565c0;border-radius:8px;padding:12px 16px;margin-bottom:12px;text-align:center}
.countdown-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#64b5f6;margin-bottom:6px}
.countdown-timer{font-size:28px;font-weight:700;color:#FFD700;letter-spacing:3px;font-variant-numeric:tabular-nums}
.countdown-sub{font-size:10px;color:#555;margin-top:4px;letter-spacing:1px}
.countdown-box.urgent{border-color:#f44336;background:#1a0a0a}
.countdown-box.urgent .countdown-label{color:#f44336}
.countdown-box.urgent .countdown-timer{color:#f44336}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:#111;border:1px solid #8B6914;border-radius:8px;padding:1.5rem;width:100%;max-width:340px}
.modal-box h2{font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#FFD700;margin-bottom:4px}
.modal-box p{font-size:11px;color:#666;letter-spacing:1px;margin-bottom:1.2rem}
.modal-box select,.modal-box input{width:100%;background:#0a0a0a;border:1px solid #444;color:#ccc;font-family:'Oswald',sans-serif;font-size:14px;padding:10px 12px;border-radius:4px;margin-bottom:10px;appearance:none}
.modal-box select:focus,.modal-box input:focus{outline:none;border-color:#8B6914}
.modal-btn{width:100%;padding:12px;background:linear-gradient(135deg,#8B6914,#FFD700);color:#000;font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:4px;cursor:pointer;margin-top:4px}
.modal-cancel{width:100%;padding:10px;background:transparent;color:#555;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;border:1px solid #333;border-radius:4px;cursor:pointer;margin-top:6px}
.modal-err{color:#f44336;font-size:11px;letter-spacing:.5px;margin-bottom:8px;display:none}
/* records */
.rec-card{background:#111;border:1px solid #2a2a2a;border-radius:6px;padding:1rem 1.1rem;margin-bottom:.75rem}
.rec-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8B6914;margin-bottom:.75rem;font-weight:600}
.rec-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a}
.rec-row:last-child{border-bottom:none}
.rec-name{font-size:14px;font-weight:600;color:#ccc}
.rec-detail{font-size:12px;color:#666;margin-top:2px}
.rec-pct{font-size:20px;font-weight:700}
.rec-pct.high{color:#4caf50}.rec-pct.mid{color:#FFD700}.rec-pct.low{color:#f44336}
.bar-bg{height:5px;background:#1a1a1a;border-radius:3px;margin-top:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s}
.bar-fill.high{background:#4caf50}.bar-fill.mid{background:#FFD700}.bar-fill.low{background:#f44336}
/* status badges na lista */
.status-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.5px}
.sb-done{background:#0d3b1a;color:#4caf50;border:1px solid #4caf50}
.sb-edit{background:#1a1500;color:#FFD700;border:1px solid #8B6914}
.sb-pending{background:#1a1a1a;color:#555;border:1px solid #333}
.sb-locked{background:#3b0d0d;color:#f44336;border:1px solid #f44336}
/* parcial de votos abaixo do jogo */
.vote-partial{display:flex;gap:4px;justify-content:space-between;margin-top:5px;font-size:9px;color:#555;letter-spacing:.3px}
.vote-partial-col{flex:1;text-align:center;line-height:1.4}
.vote-partial-col.has-votes{color:#8B6914}
/* palpite especial (campeão etc) */
.special-block{border:1px solid #2a2a2a;border-radius:6px;padding:12px 14px;margin-bottom:8px;background:#0d0d0d;cursor:pointer;transition:border-color .15s}
.special-block:hover{border-color:#8B6914}
.special-block.done{border-color:#4caf50;background:#061a0f}
.special-block.locked{cursor:default;border-color:#2a2a2a}
.special-title{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#8B6914;margin-bottom:4px}
.special-val{font-size:14px;font-weight:700;color:#FFD700}
.special-hint{font-size:10px;color:#555;letter-spacing:.5px;margin-top:3px}
/* modal de seleção de seleção */
.nations-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;display:flex;flex-direction:column;padding:1rem}
.nations-modal-box{background:#111;border:1px solid #8B6914;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;max-height:90vh;width:100%;max-width:400px;margin:auto}
.nations-header{padding:12px 16px;border-bottom:1px solid #2a2a2a;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#FFD700;display:flex;justify-content:space-between;align-items:center}
.nations-list{overflow-y:auto;flex:1}
.nation-item{padding:11px 16px;border-bottom:1px solid #1a1a1a;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;color:#aaa;transition:background .15s}
.nation-item:hover{background:#1a1a1a}
.nation-item.sel{background:#0d3b1a;color:#4caf50;font-weight:600}
.nation-item:last-child{border-bottom:none}
/* tela inicial de seleção de nome */
.welcome-screen{display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 1rem;text-align:center}
.welcome-logo{width:120px;height:120px;object-fit:contain;margin-bottom:1rem}
.welcome-title{font-size:clamp(20px,5vw,28px);font-weight:700;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(135deg,#FFD700,#FFA500,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.welcome-sub{font-size:10px;letter-spacing:2px;color:#8B6914;text-transform:uppercase;margin-bottom:1.5rem}
/* ptabs de palpite (jogos / especiais) */
.ptab-row{display:flex;gap:6px;margin-bottom:1rem;border-bottom:1px solid #2a2a2a;padding-bottom:8px}
.ptab-btn{padding:8px 14px;font-size:11px;font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:1px;text-transform:uppercase;border:1px solid #444;border-radius:4px;background:transparent;cursor:pointer;color:#666;transition:all .2s}
.ptab-btn.active{border-color:#FFD700;color:#FFD700;background:#1a1500}
/* reopen per-game */
.btn-reopen-game{padding:4px 10px;font-size:10px;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:1px solid #1565c0;border-radius:3px;background:#0a1a2a;color:#64b5f6;cursor:pointer;margin-top:6px;transition:all .2s}
.btn-reopen-game:hover{background:#1565c0;color:#fff}
/* ── Eliminatórias ─────────────────────────────────────────────────────────── */
.elim-phase-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B6914;margin:1rem 0 .5rem;padding-bottom:6px;border-bottom:1px solid #2a2a2a}
.elim-match{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:6px;padding:10px 12px;margin-bottom:8px}
.elim-match.winner-set{border-color:#4caf50}
.elim-match-meta{font-size:9px;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.elim-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center}
.elim-btn{padding:8px 6px;font-size:10px;font-family:'Oswald',sans-serif;font-weight:500;border:1px solid #333;border-radius:4px;background:#0a0a0a;cursor:pointer;color:#666;text-align:center;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;line-height:1.2}
.elim-btn .fl{font-size:18px;line-height:1}
.elim-btn .tn{font-size:9px;letter-spacing:.3px}
.elim-btn.sel{background:#1a1500;border-color:#FFD700;color:#FFD700;font-weight:600}
.elim-btn.winner{background:#0d3b1a;border-color:#4caf50;color:#4caf50;font-weight:700}
.elim-btn.loser{opacity:.35}
.elim-btn:disabled{cursor:not-allowed}
.elim-sep{font-size:11px;color:#444;text-align:center}
.elim-partial{display:flex;gap:4px;justify-content:space-between;margin-top:5px;font-size:9px;color:#555}
.elim-partial-col{flex:1;text-align:center;line-height:1.3}
.elim-partial-col.hv{color:#8B6914}
.advance-badge{display:inline-block;font-size:9px;padding:2px 6px;background:#0d3b1a;color:#4caf50;border:1px solid #4caf50;border-radius:3px;margin-top:4px;letter-spacing:.5px}
.elim-tbd{color:#444;font-size:11px;font-style:italic;padding:8px 6px;text-align:center;min-height:50px;display:flex;align-items:center;justify-content:center;border:1px dashed #2a2a2a;border-radius:4px}
.elim-vote-partial{display:flex;gap:2px;justify-content:space-between;margin-top:4px;font-size:9px}
</style>
</head>
<body>
<div class="loading-screen" id="loading">
  <img src="LOGO_PLACEHOLDER" style="width:100px;height:100px;object-fit:contain" onerror="this.style.display='none'">
  <p>Carregando bolão...</p>
  <div class="spinner"></div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="login-modal" style="display:none">
  <div class="modal-box">
    <h2>Área Restrita</h2>
    <p>Apenas administradores podem acessar esta área.</p>
    <div class="modal-err" id="login-err">Senha incorreta.</div>
    <select id="login-user">
      <option value="">Selecione seu nome</option>
      <option value="Pedro">Pedro</option>
      <option value="Rosalves">Rosalves</option>
    </select>
    <input type="password" id="login-pass" placeholder="Senha" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="modal-btn" onclick="doLogin()">Entrar</button>
    <button class="modal-cancel" onclick="closeLoginModal()">Cancelar</button>
  </div>
</div>

<!-- Modal de seleção de seleção (campeão etc) -->
<div class="nations-modal" id="nations-modal" style="display:none">
  <div class="nations-modal-box">
    <div class="nations-header">
      <span id="nations-modal-title">Selecione a seleção</span>
      <button onclick="closeNationsModal()" style="background:none;border:none;color:#8B6914;font-size:20px;cursor:pointer;line-height:1">×</button>
    </div>
    <div class="nations-list" id="nations-list"></div>
    <div style="padding:10px 14px;border-top:1px solid #2a2a2a;display:flex;gap:8px">
      <button class="modal-btn" style="flex:1" onclick="confirmNations()">Confirmar</button>
      <button class="modal-cancel" style="flex:1;margin-top:0" onclick="closeNationsModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Tela inicial de seleção de nome -->
<div class="app" id="welcome-app" style="display:none">
  <div class="wm">🏆</div>
  <div class="inner">
    <div class="welcome-screen">
      <img src="LOGO_PLACEHOLDER" class="welcome-logo" onerror="this.style.display='none'">
      <div class="welcome-title">Os Donos das Bolas</div>
      <div class="welcome-sub">Bolão Copa do Mundo 2026</div>

function getRoundTimeStatus(rid) {
  const now = new Date();
  const sched = ROUND_SCHEDULE[rid];
  if (!sched) return { open: true, label: '' };
  if (now < sched.closeAt) {
    const diff = sched.closeAt - now;
    return { open: true, countdown: diff, label: 'palpites fecham em', urgent: diff < 3600000 };
  }
  if (now >= sched.closeAt && now < sched.reopenAt) {
    return { open: false, label: 'Palpites encerrados — aguardando rodada' };
  }
  return { open: true, label: '' };
}

function canVote(rid) {
  if (state.closed[rid]) return false;

  if (state.manualOpen && state.manualOpen[rid]) return true;
  const ts = getRoundTimeStatus(rid);
  return ts.open;
}

function fmtCountdown(ms) {
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = v => String(v).padStart(2,'0');
  if (h > 0) return `${pad(h)}:${pad(m)}:${pad(sec)}`;
  return `${pad(m)}:${pad(sec)}`;
}

    'Luís Eduardo':'draw','João Victor':'draw'
  };
  Object.entries(E03_VOTES).forEach(([p,v])=>{
    if(!state.elimVotes[p])state.elimVotes[p]={};
    if(!state.elimVotes[p]['e03'])state.elimVotes[p]['e03']=v;
  });
  // Resultado: Canadá venceu (away)
  if(!state.elimResults['e03']){
    state.elimResults['e03']={winner:'Canadá',loser:'África do Sul',outcome:'away'};
    autoSaved=true;
  }
  loaded=true;
  if(!state.submitted)state.submitted={};
  let autoSaved=false;
  ROUNDS.forEach(r=>{
    const votes=state.votes[r.id]||{};
    PARTICIPANTS.forEach(p=>{
      const pv=votes[p]||{};
      const done=r.games.filter(g=>pv[g.id]).length;
      if(done===r.games.length){
        if(!state.submitted[p])state.submitted[p]={};
        if(!state.submitted[p][r.id]){state.submitted[p][r.id]=true;autoSaved=true;}
      }
    });
  });
  if(autoSaved)save();
  document.getElementById('loading').style.display='none';
  // Mostrar tela de seleção de nome
  document.getElementById('welcome-app').style.display='block';
  renderWelcome();
  startCountdownTick();
}
let saveTimer=null;
async function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await fetch(`${FIREBASE_URL}/${DB_KEY}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
      const t=document.getElementById('saving-toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);
    }catch(e){console.warn('Erro ao salvar',e);}
  },500);
}

// ── Helpers de palpites ───────────────────────────────────────────────────────
function isSubmitted(p,rid){
  return !!(state.submitted&&state.submitted[p]&&state.submitted[p][rid]);
}
function getDraft(p,rid){
  if(!draft[p])draft[p]={};
  if(!draft[p][rid]){
    const saved=(state.votes[rid]&&state.votes[rid][p])||{};
    draft[p][rid]=Object.assign({},saved);
  }
  return draft[p][rid];
}

// Verifica se Pedro reabriu jogo específico para participante
function isGameReopened(rid,gid,p){
  return !!(state.gameReopen&&state.gameReopen[rid]&&state.gameReopen[rid][gid]&&state.gameReopen[rid][gid][p]);
}

// canVoteGame: verifica se pode votar naquele jogo específico
function canVoteGame(rid,gid,p){
  if(state.closed[rid])return false;
  // Jogo específico reaberto pelo Pedro para essa pessoa?
  if(isGameReopened(rid,gid,p))return true;
  // Rodada reaberta manualmente pelo Pedro?
  if(state.manualOpen&&state.manualOpen[rid])return true;
  // Jogo já começou? Não pode votar
  if(gameStarted(gid))return false;
  // Rodada aberta por tempo?
  const ts=getRoundTimeStatus(rid);
  return ts.open;
}

// ── Palpites ─ formulário ─────────────────────────────────────────────────────
function renderPalpiteForm(c){
  // Se aba eliminatórias, apenas mostrar seletor de rodadas + conteúdo elim
  if(activePTab==='elim'){
    const roundBtns=ROUNDS.map(r2=>{
      const ul=state.unlocked[r2.id];
      return `<button class="rtab${activePTab===r2.id?' active':''}" onclick="selectPTab('${r2.id}')" ${!ul?'disabled':''}>${r2.name}</button>`;
    }).join('');
    const elimBtn=`<button class="rtab active">🏟️ Eliminat.</button>`;
    let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="pname-display">${activeP}</div>
    </div>
    <div class="round-tab-row">${roundBtns}${elimBtn}</div>`;
    html+=renderElimHTML();
    c.innerHTML=html;
    startCountdownTick();
    return;
  }

  const r=ROUNDS.find(x=>x.id===activePTab)||ROUNDS[0];
  const rid=r.id;
  const cv=canVote(rid);
  const submitted=isSubmitted(activeP,rid);
  const roundClosed=state.closed[rid];

  const pv = getDraft(activeP,rid);
  const pvDisplay = (!cv && !Object.keys(pv).some(k=>pv[k])) ? ((state.votes[rid]&&state.votes[rid][activeP])||{}) : pv;

  const done=r.games.filter(g=>pvDisplay[g.id]).length;
  const total=r.games.length;
  const allDone=done===total;

  const ts=getRoundTimeStatus(rid);

  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div class="pname-display">${activeP}</div>
    <span class="pill ${allDone?'pill-ok':'pill-no'}">${done}/${total}</span>
  </div>`;

  // Abas de rodada — inclui Eliminatórias como última aba
  const roundBtns=ROUNDS.map(r2=>{
    const ul=state.unlocked[r2.id];
    return `<button class="rtab${activePTab===r2.id?' active':''}" onclick="selectPTab('${r2.id}')" ${!ul?'disabled':''}>${r2.name}</button>`;
  }).join('');
  const elimBtn=`<button class="rtab${activePTab==='elim'?' active':''}" onclick="selectPTab('elim')">🏟️ Eliminat.</button>`;
  html+=`<div class="round-tab-row">${roundBtns}${elimBtn}</div>`;

  // Countdown
  if(!roundClosed && ts.countdown!=null){
    html+=`<div class="countdown-box${ts.urgent?' urgent':''}" id="countdown-box">
      <input type="hidden" id="countdown-timer-rid" value="${rid}">
      <div class="countdown-label">⏰ ${ts.label}</div>
      <div class="countdown-timer" id="countdown-timer-val">${fmtCountdown(ts.countdown)}</div>
      <div class="countdown-sub">Após esse horário os palpites serão bloqueados automaticamente</div>
    </div>`;
  }

  // Status notices
  if(roundClosed){
    html+=`<div class="notice notice-warn">🔒 Rodada encerrada — apenas consulta.</div>`;
  } else if(state.manualOpen&&state.manualOpen[rid]){
    html+=`<div class="notice notice-info">🔓 Rodada reaberta pelo administrador. Palpites de jogos não iniciados podem ser editados.</div>`;
  } else if(!cv){
    html+=`<div class="notice notice-err">⏰ Palpites fechados para esta rodada.</div>`;
  } else if(submitted){
    html+=`<div class="notice notice-ok">✅ Palpite enviado! Você pode editar até 30 min antes do 1º jogo.</div>`;
  }

  // Botão Pedro: reabrir rodada
  if(isPedro()&&!roundClosed){
    const isOpen=state.manualOpen&&state.manualOpen[rid];
    html+=`<button class="btn-reopen" onclick="toggleManualOpen('${rid}')">${isOpen?'🔒 Fechar palpites desta rodada':'🔓 Reabrir palpites desta rodada (Pedro)'}</button>`;
  }

  // Jogos
  const allVotes=state.votes[rid]||{};
  r.games.forEach(g=>{
    const gid=g.id;
    const canVG=canVoteGame(rid,gid,activeP);
    const sel=pvDisplay[gid]||'';
    const resVal=state.results[rid]&&state.results[rid][gid];
    const dis=canVG?'':'disabled';

    const bc=(v)=>{
      const base=v==='draw'?'vote-draw':'vote-btn';
      if((roundClosed||!cv)&&resVal){
        if(sel===v&&v===resVal)return base+' correct';
        if(sel===v&&v!==resVal)return base+' wrong';
        if(v===resVal)return base+' sel';
        return base;
      }
      return base+(sel===v?' sel':'');
    };

    // Parcial: quem votou em quê neste jogo
    const homeVoters=[],drawVoters=[],awayVoters=[];
    PARTICIPANTS.forEach(pt=>{
      const v=(allVotes[pt]||{})[gid];
      if(v==='home')homeVoters.push(pt);
      else if(v==='draw')drawVoters.push(pt);
      else if(v==='away')awayVoters.push(pt);
    });
    const fmtVoters=arr=>arr.length?arr.map(n=>n.split(' ')[0]).join(', '):'—';

    html+=`<div class="game-block">
      <div class="game-meta">${g.time} · Grupo ${g.group}</div>
      <div class="vote-row">
        <button class="${bc('home')}" ${dis} onclick="setVote('${rid}','${gid}','home')">
          <span class="fl">${F(g.home)}</span><span class="tn">${g.home}</span>
        </button>
        <button class="${bc('draw')}" ${dis} onclick="setVote('${rid}','${gid}','draw')">EMP</button>
        <button class="${bc('away')}" ${dis} onclick="setVote('${rid}','${gid}','away')">
          <span class="fl">${F(g.away)}</span><span class="tn">${g.away}</span>
        </button>
      </div>
      <div class="vote-partial">
        <div class="vote-partial-col${homeVoters.length?' has-votes':''}">${fmtVoters(homeVoters)}</div>
        <div class="vote-partial-col${drawVoters.length?' has-votes':''}">${fmtVoters(drawVoters)}</div>
        <div class="vote-partial-col${awayVoters.length?' has-votes':''}">${fmtVoters(awayVoters)}</div>
      </div>
      ${isPedro()&&!roundClosed&&!canVG&&gameStarted(gid)?'<div style="font-size:9px;color:#444;margin-top:4px;letter-spacing:.5px">jogo em andamento — não é possível reabrir</div>':''}
      ${isPedro()&&!roundClosed&&!canVG&&!gameStarted(gid)?renderReopenButtons(rid,gid):''}
    </div>`;
  });

  // Botão enviar / editar
  const anyEditable=r.games.some(g=>canVoteGame(rid,g.id,activeP));
  if(anyEditable){
    if(!submitted){
      const allEditableDone=r.games.every(g=>{
        if(!canVoteGame(rid,g.id,activeP))return true; // não precisa votar em jogos bloqueados já votados
        return !!pvDisplay[g.id];
      });
      const allFilled=r.games.every(g=>!!pvDisplay[g.id]);
      html+=`<button class="btn-gold" ${!allFilled?'disabled':''} onclick="submitPalpite('${rid}')">
        ${allFilled?'✅ Enviar Palpite':'⚽ Preencha todos os jogos para enviar'}
      </button>`;
      if(!allFilled)html+=`<p style="font-size:11px;color:#555;text-align:center;margin-top:8px">${done} de ${total} jogos preenchidos</p>`;
    } else {
      html+=`<button class="btn-outline" onclick="editPalpite('${rid}')">✏️ Editar Palpite</button>`;
    }
  }

  c.innerHTML=html;
  startCountdownTick();
}

function renderReopenButtons(rid,gid){
  let html=`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">`;
  PARTICIPANTS.forEach(p=>{
    const esc=p.replace(/'/g,"\\'");
    const isOpen=isGameReopened(rid,gid,p);
    html+=`<button class="btn-reopen-game${isOpen?' active':''}" onclick="toggleGameReopen('${rid}','${gid}','${esc}')" style="${isOpen?'background:#0d3b1a;border-color:#4caf50;color:#4caf50':''}">
      ${isOpen?'✓':''} ${p.split(' ')[0]}
    </button>`;
  });
  html+=`</div>`;
  return html;
}

function toggleManualOpen(rid){
  if(!isPedro())return;
  if(!state.manualOpen)state.manualOpen={};
  state.manualOpen[rid]=!state.manualOpen[rid];
  save();renderPalpites();
}

function toggleGameReopen(rid,gid,p){
  if(!isPedro())return;
  if(gameStarted(gid)){alert('Este jogo já começou, não é possível reabrir.');return;}
  if(!state.gameReopen)state.gameReopen={};
  if(!state.gameReopen[rid])state.gameReopen[rid]={};
  if(!state.gameReopen[rid][gid])state.gameReopen[rid][gid]={};
  state.gameReopen[rid][gid][p]=!state.gameReopen[rid][gid][p];
  save();renderPalpites();
}

function selectPTab(rid){
  activePTab=rid;
  // Recalcular done/total só para rodadas normais
  renderPalpites();
}
function selectPSubTab(t){activePSubTab=t;renderPalpites();}

function setVote(rid,gid,val){
  if(!canVoteGame(rid,gid,activeP))return;
  const d=getDraft(activeP,rid);
  d[gid]=val;
  // Salvar direto no state também
  if(!state.votes[rid])state.votes[rid]={};
  if(!state.votes[rid][activeP])state.votes[rid][activeP]={};
  state.votes[rid][activeP][gid]=val;
  save();
  renderPalpites();
}

function submitPalpite(rid){
  const d=getDraft(activeP,rid);
  const r=ROUNDS.find(x=>x.id===rid);
  if(r.games.some(g=>!d[g.id]))return;
  if(!state.votes[rid])state.votes[rid]={};
  state.votes[rid][activeP]=Object.assign({},d);
  if(!state.submitted)state.submitted={};
  if(!state.submitted[activeP])state.submitted[activeP]={};
  state.submitted[activeP][rid]=true;
  save();
  renderPalpites();
}

function editPalpite(rid){
  if(!canVote(rid)&&!r.games.some(g=>canVoteGame(rid,g.id,activeP)))return;
  if(!state.submitted[activeP])return;
  delete state.submitted[activeP][rid];
  renderPalpites();
}

// ── Especiais da Copa ─────────────────────────────────────────────────────────
const SPECIAL_TYPES=[
  {id:'champion',label:'🏆 Campeão da Copa',hint:'Escolha 1 seleção',multi:false},
  {id:'surprise',label:'🌟 Surpresa da Copa',hint:'Escolha 1 seleção',multi:false},
  {id:'disappointment',label:'😞 Decepção da Copa',hint:'Escolha 1 seleção',multi:false},
  {id:'goFar',label:'🚀 Vai Longe na Copa',hint:'Escolha até 3 seleções',multi:true,max:3},
];

function renderSpeciaisHTML(){
  const locked=!!(state.specialLocked&&state.specialLocked[activeP]);
  const picks=(state.specialPicks&&state.specialPicks[activeP])||{};
  let html=`<div class="notice notice-info">🌟 Palpites especiais — não contam para o ranking, serão revelados ao final da Copa.</div>`;
  if(locked){
    html+=`<div class="notice notice-ok">✅ Palpite especial enviado! ${isPedro()?'':'Aguarde o final da Copa para o resultado.'}</div>`;
  }

  SPECIAL_TYPES.forEach(st=>{
    const val=picks[st.id];
    const hasVal=multi_hasVal(st,val);
    const displayVal=multi_displayVal(st,val);

    const isLocked2=locked&&!isPedro();
    html+=`<div class="special-block${hasVal?' done':''}${isLocked2?' locked':''}" onclick="${isLocked2?'':'openNationsModal(\''+st.id+'\')'}">
      <div class="special-title">${st.label}</div>
      <div class="special-val">${hasVal?displayVal:'— Selecione —'}</div>
      <div class="special-hint">${st.hint}${hasVal?' ✓':''}</div>
    </div>`;
  });

  if(!locked){
    const allFilled=SPECIAL_TYPES.every(st=>multi_hasVal(st,picks[st.id]));
    html+=`<button class="btn-gold" ${!allFilled?'disabled':''} onclick="submitSpeciais()">
      ${allFilled?'✅ Enviar Palpites Especiais':'Preencha todos os campos acima'}
    </button>`;
  } else if(isPedro()){
    html+=`<div style="margin-top:10px"><div class="plist-header" style="border-radius:6px 6px 0 0;padding:10px 14px">🔓 Pedro — Reabrir palpite especial por participante</div>`;
    PARTICIPANTS.forEach(p=>{
      const esc=p.replace(/'/g,"\\'");
      const lk=!!(state.specialLocked&&state.specialLocked[p]);
      html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #1a1a1a;background:#0d0d0d">
        <span style="font-size:13px;color:${lk?'#4caf50':'#666'}">${p} ${lk?'✓ enviado':'pendente'}</span>
        ${lk?`<button class="btn-reopen-game" onclick="reopenSpecial('${esc}')">Reabrir</button>`:''}
      </div>`;
    });
    html+=`</div>`;
  }
  return html;
}

function multi_hasVal(st,val){
  if(!val)return false;
  if(st.multi)return Array.isArray(val)&&val.length>0;
  return !!val;
}
function multi_displayVal(st,val){
  if(!val)return '';
  if(st.multi&&Array.isArray(val))return val.map(v=>`${F(v)} ${v}`).join(', ');
  return `${F(val)} ${val}`;
}

// Modal de nações
let _nationsType=null;
let _nationsTempSel=[];

function openNationsModal(typeId){
  if(!!(state.specialLocked&&state.specialLocked[activeP])&&!isPedro())return;
  const st=SPECIAL_TYPES.find(x=>x.id===typeId);
  if(!st)return;
  _nationsType=typeId;
  const picks=(state.specialPicks&&state.specialPicks[activeP])||{};
  const cur=picks[typeId];
  _nationsTempSel=st.multi?(Array.isArray(cur)?[...cur]:[]):(cur?[cur]:[]);
  document.getElementById('nations-modal-title').textContent=st.label+(st.multi?` (máx ${st.max})`:'');
  renderNationsList();
  document.getElementById('nations-modal').style.display='flex';
}

function renderNationsList(){
  const st=SPECIAL_TYPES.find(x=>x.id===_nationsType);
  const c=document.getElementById('nations-list');
  let html='';
  ALL_NATIONS.forEach(n=>{
    const esc=n.replace(/'/g,"\\'");
    const isSel=_nationsTempSel.includes(n);
    html+=`<div class="nation-item${isSel?' sel':''}" onclick="toggleNation('${esc}')">
      <span>${F(n)}</span><span>${n}</span>
      ${isSel?'<span style="margin-left:auto;color:#4caf50">✓</span>':''}
    </div>`;
  });
  c.innerHTML=html;
}

function toggleNation(n){
  const st=SPECIAL_TYPES.find(x=>x.id===_nationsType);
  if(!st)return;
  if(st.multi){
    const idx=_nationsTempSel.indexOf(n);
    if(idx>=0){_nationsTempSel.splice(idx,1);}
    else{if(_nationsTempSel.length>=(st.max||1)){alert(`Máximo de ${st.max} seleções.`);return;}_nationsTempSel.push(n);}
  } else {
    _nationsTempSel=[n];
  }
  renderNationsList();
}

function confirmNations(){
  const st=SPECIAL_TYPES.find(x=>x.id===_nationsType);
  if(!st||!_nationsTempSel.length){closeNationsModal();return;}
  if(!state.specialPicks)state.specialPicks={};
  if(!state.specialPicks[activeP])state.specialPicks[activeP]={};
  state.specialPicks[activeP][_nationsType]=st.multi?[..._nationsTempSel]:_nationsTempSel[0];
  save();
  closeNationsModal();
  renderPalpites();
}

function closeNationsModal(){
  document.getElementById('nations-modal').style.display='none';
  _nationsType=null;_nationsTempSel=[];
}

function submitSpeciais(){
  const picks=(state.specialPicks&&state.specialPicks[activeP])||{};
  const allFilled=SPECIAL_TYPES.every(st=>multi_hasVal(st,picks[st.id]));
  if(!allFilled)return;
  if(!state.specialLocked)state.specialLocked={};
  state.specialLocked[activeP]=true;
  save();renderPalpites();
}

function reopenSpecial(p){
  if(!isPedro())return;
  if(!state.specialLocked)state.specialLocked={};
  delete state.specialLocked[p];
  save();renderPalpites();
}

function renderResBody(){

  let html='';

function setResult(rid,gid,val){
  if(!state.results[rid])state.results[rid]={};
  state.results[rid][gid]=state.results[rid][gid]===val?undefined:val;
  if(state.results[rid][gid]===undefined)delete state.results[rid][gid];
  save();renderResBody();
}
function closeRound(rid){
  state.closed[rid]=true;
  const idx=ROUNDS.findIndex(r=>r.id===rid);
  if(idx+1<ROUNDS.length)state.unlocked[ROUNDS[idx+1].id]=true;
  save();renderResultados();showTab('rank');
}

// ── Scores ────────────────────────────────────────────────────────────────────
function computeScores(){
  const sc={};
  PARTICIPANTS.forEach(p=>sc[p]={total:0,byRound:{}});
  ROUNDS.forEach(r=>{
    const res=state.results[r.id]||{};
    const votes=state.votes[r.id]||{};
    PARTICIPANTS.forEach(p=>{
      const pv=votes[p]||{};let pts=0;
      r.games.forEach(g=>{if(res[g.id]&&pv[g.id]===res[g.id])pts++;});
      sc[p].byRound[r.id]=pts;sc[p].total+=pts;
    });
  });
  return sc;
}

// Resolve o nome do time num slot (pode ser string fixa ou dependente de resultado)
function resolveTeam(slot) {
  if (!slot) return null;
  if (typeof slot === 'string') return slot;
  // slot = {from: 'e01', side: 'winner'}
  const res = (state.elimResults && state.elimResults[slot.from]);
  if (!res) return null; // ainda não decidido
  return res[slot.side] || null;
}

// Obtém todos os vencedores/perdedores propagados pelo bracket
function getElimTeam(matchId, side) {
  const res = state.elimResults && state.elimResults[matchId];
  if (!res) return null;
  return res[side] || null;
}

// Registra resultado: outcome = 'home'|'draw'|'away'
// Em caso de empate na fase eliminatória, o 'home' avança por convenção
// mas o admin escolhe quem realmente avançou via prorrogação/pênaltis:
// na prática, em eliminatórias o empate significa que haverá prorrogação —
// então o admin vota 'draw' no resultado normal e depois Pedro escolhe quem avançou.
// Simplificado: se outcome='draw', pedimos ao Pedro qual time avançou em seguida.
function setElimResult(matchId, outcome) {
  const match = ELIM_BRACKET.find(m => m.id === matchId);
  if (!match) return;
  const home = resolveTeam(match.home);
  const away = resolveTeam(match.away);
  if (!home || !away) return;

  let winner, loser;
  if (outcome === 'home') { winner = home; loser = away; }
  else if (outcome === 'away') { winner = away; loser = home; }
  else {
    // Empate: pedir quem avançou (prorrogação/pênaltis)
    const choice = confirm(`Empate em ${home} × ${away}.\n\nClique OK para ${home} avançar, ou Cancelar para ${away} avançar.`);
    winner = choice ? home : away;
    loser  = choice ? away : home;
  }

  if (!state.elimResults) state.elimResults = {};
  state.elimResults[matchId] = {winner, loser, outcome};
  save();
  renderPalpites();
}

function clearElimResult(matchId) {
  if (!state.elimResults) return;
  function clearDown(mid) {
    if (!state.elimResults[mid]) return;
    delete state.elimResults[mid];
    ELIM_BRACKET.forEach(m => {
      const hFrom = m.home && m.home.from;
      const aFrom = m.away && m.away.from;
      if (hFrom === mid || aFrom === mid) clearDown(m.id);
    });
  }
  clearDown(matchId);
  save();
  renderPalpites();
}

// Palpites eliminatórias: estado.elimVotes = {pid: {matchId: 'home'|'draw'|'away'}}
function getElimVote(pid, matchId) {
  return state.elimVotes && state.elimVotes[pid] && state.elimVotes[pid][matchId];
}
function setElimVote(matchId, val) {
  // val = 'home' | 'draw' | 'away'
  if (state.elimResults && state.elimResults[matchId]) {
    alert('Este jogo já tem resultado — palpite bloqueado.');
    return;
  }
  if (!state.elimVotes) state.elimVotes = {};
  if (!state.elimVotes[activeP]) state.elimVotes[activeP] = {};
  state.elimVotes[activeP][matchId] = val;
  save();
  renderPalpites();
}

// Gera HTML do chaveamento (usado dentro da aba palpites)
function renderElimHTML() {
  if (!state.elimResults) state.elimResults = {};
  if (!state.elimVotes) state.elimVotes = {};

  const phases = ['16avos','oitavas','quartas','semi','final'];
  let html = '';
  html += `<div class="notice notice-info">🏟️ Palpite no resultado de cada jogo. O vencedor avança automaticamente. Palpites ficam abertos até o resultado ser lançado.</div>`;

  phases.forEach(ph => {
    const matches = ELIM_BRACKET.filter(m => m.phase === ph);
    if (!matches.length) return;
    html += `<div class="elim-phase-title">${ELIM_PHASE_LABELS[ph]}</div>`;

    matches.forEach(m => {
      const home = resolveTeam(m.home);
      const away = resolveTeam(m.away);
      const res = state.elimResults[m.id]; // {winner, outcome: 'home'|'draw'|'away'}
      const myVote = getElimVote(activeP, m.id); // 'home'|'draw'|'away'
      const resultLaunched = !!res;
      const canVoteThis = !resultLaunched && home && away;

      // Parcial: contar por slot
      const homeVoters = [], drawVoters = [], awayVoters = [];
      if (home && away) {
        PARTICIPANTS.forEach(p => {
          const v = getElimVote(p, m.id);
          if (v === 'home') homeVoters.push(p.split(' ')[0]);
          else if (v === 'draw') drawVoters.push(p.split(' ')[0]);
          else if (v === 'away') awayVoters.push(p.split(' ')[0]);
        });
      }

      // Classes dos botões de palpite
      const btnCls = (slot) => {
        let cls = slot === 'draw' ? 'vote-draw' : 'vote-btn';
        if (resultLaunched && res.outcome) {
          if (myVote === slot && myVote === res.outcome) cls += ' correct';
          else if (myVote === slot && myVote !== res.outcome) cls += ' wrong';
          else if (slot === res.outcome) cls += ' sel';
        } else if (myVote === slot) {
          cls += ' sel';
        }
        return cls;
      };

      const safeQ = s => s ? s.replace(/'/g,"\\'") : '';
      const dis = canVoteThis ? '' : 'disabled';

      html += `<div class="elim-match${resultLaunched?' winner-set':''}">
        <div class="elim-match-meta">${m.date}${m.time&&m.time!==''?' '+m.time:''} ${m.venue||''}</div>
        <div class="vote-row">`;

      html += home
        ? `<button class="${btnCls('home')}" ${dis} onclick="setElimVote('${m.id}','home')"><span class="fl">${F(home)}</span><span class="tn">${home}</span></button>`
        : `<div class="elim-tbd">A definir</div>`;

      html += home && away
        ? `<button class="${btnCls('draw')}" ${dis} onclick="setElimVote('${m.id}','draw')">EMP</button>`
        : `<span></span>`;

      html += away
        ? `<button class="${btnCls('away')}" ${dis} onclick="setElimVote('${m.id}','away')"><span class="fl">${F(away)}</span><span class="tn">${away}</span></button>`
        : `<div class="elim-tbd">A definir</div>`;

      html += `</div>`;

      // Parcial de votos (3 colunas: casa | empate | fora)
      if (home && away) {
        html += `<div class="vote-partial">
          <div class="vote-partial-col${homeVoters.length?' has-votes':''}">${homeVoters.join(', ')||'—'}</div>
          <div class="vote-partial-col${drawVoters.length?' has-votes':''}">${drawVoters.join(', ')||'—'}</div>
          <div class="vote-partial-col${awayVoters.length?' has-votes':''}">${awayVoters.join(', ')||'—'}</div>
        </div>`;
      }

      if (resultLaunched) {
        const outcomeLabel = res.outcome === 'draw' ? 'Empate' : `${res.winner} venceu`;
        html += `<div style="margin-top:5px">
          <span class="advance-badge">✓ ${res.outcome==='draw'?'Empate — prorrogação/pênaltis':res.winner+' avançou'}</span>`;
        if (isPedro()) html += ` <button class="btn-reopen-game" style="margin-left:6px" onclick="clearElimResult('${m.id}')">🔄 Corrigir</button>`;
        html += `</div>`;
      }

      // Botões admin para lançar resultado
      if (isPedro() && home && away && !resultLaunched) {
        html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #1a1a1a">
          <div style="font-size:9px;color:#8B6914;letter-spacing:1px;margin-bottom:4px">★ ADMIN — Lançar resultado:</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="result-btn" onclick="setElimResult('${m.id}','home')">${F(home)} ${home} venceu</button>
            <button class="result-btn" onclick="setElimResult('${m.id}','draw')">Empate (prorr./pên.)</button>
            <button class="result-btn" onclick="setElimResult('${m.id}','away')">${F(away)} ${away} venceu</button>
          </div>
        </div>`;
      }

      html += `</div>`;
    });
  });
  return html;
}

// Aba Especiais (própria aba no topo)
function renderEspeciaisTab() {
  const c = document.getElementById('tab-especiais');
  if (!loaded) { c.innerHTML = '<div class="empty">Carregando...</div>'; return; }
  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div class="pname-display">${activeP}</div>
  </div>`;
  html += renderSpeciaisHTML();
  c.innerHTML = html;
}

function voltarWelcome(){
  document.getElementById('app').style.display='none';
  document.getElementById('welcome-app').style.display='block';
  renderWelcome();
}

loadState();
